; PlatformIO project: single-binary runtime-parameterized transformer on
; the Seeed XIAO ESP32-C3.  transformer.c/h take the case geometry at runtime
; (tm_case), so one firmware image serves every geometry that fits in SRAM;
; this project embeds the case-2 weights (S=128 D=128 H=4 F=128 L=4) to
; self-test and on-device profile the function.
;
;   pio run -t upload          flash the auto-detected C3
;   pio device monitor -b 115200

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -O2
    -std=gnu++11
board_build.embed_files =
    weights.bin
    weights_q12.bin
    input_0.bin
    ref_0.bin
