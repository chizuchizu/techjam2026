
; PlatformIO project for the Tech Jam case-11 transformer on the
; Seeed XIAO ESP32C3. The whole point is the FAST hybrid numeric path
; (Q15xQ12 fixed-point GEMM and integer attention) measured at 2.166 s/forward.
;
; Two envs point at the same code:
;   esp32-baseline     - primary target, Seeed XIAO ESP32C3
;   esp32-c3-devkitc   - fallback board (generic ESP32-C3 devkit) for CI/host-less
;
; Weight blobs are embedded from the project root (weights.bin = 1.59 MB
; fp32 layout; weights_q12.bin = 0.79 MB Q12 + scales), total flash ~2.4 MB.
;
; Build & upload:
;   pio run -t upload                    (uses AUTO-DETECTED port)
;   pio run -e esp32-baseline -t upload  (explicit env)
;   pio device monitor -b 115200         (interact: M / R / T)
[platformio]
default_envs = esp32-baseline

[env:esp32-baseline]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<main_wifi.cpp>
# single 3.9 MB app partition (no OTA) so the ~2.4 MB embedded weights fit
board_build.partitions = huge_app.csv
build_flags =
    -O2
    -std=gnu++11
    -DTM_MODE_DEFAULT=1
board_build.embed_files =
    weights.bin
    weights_q12.bin

[env:esp32-c3-devkitc]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<main_wifi.cpp>
board_build.partitions = huge_app.csv
build_flags =
    -O2
    -std=gnu++11
    -DTM_MODE_DEFAULT=1
board_build.embed_files =
    weights.bin
    weights_q12.bin

; Opt-in sequential-tiled FAST forward plus persistent WiFi/TCP endpoint.
; The default optimized environments remain unchanged.
[env:esp32-wifi-tiled]
extends = env:esp32-baseline
board_build.partitions = partitions_wifi_tiled.csv
build_src_filter =
    +<*>
    -<main.cpp>
build_flags =
    ${env:esp32-baseline.build_flags}
    -DTM_TILED_FORWARD=1
    -DTM_TILE_ROWS=16
    -DTM_A16_ROWS=16
    -DTM_WIFI_TRANSPORT=1
