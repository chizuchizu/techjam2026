; Two-board case-2 transformer cluster (sequence-sharded, one binary for both
; nodes; the host assigns node 0 / node 1 at runtime over serial).
;
; The numeric kernels and the weight blobs are the maintained single-board
; ones - this project compiles ../../optimisation/esp32-baseline/src/kernels.c
; and embeds that project's weights.bin / weights_q12.bin, so the cluster can
; never drift from the optimised single-board path.
;
;   pio run -t upload --upload-port /dev/ttyACM0
;   pio run -t upload --upload-port /dev/ttyACM1
;   python3 tools/run_cluster_e2e.py /dev/ttyACM0 /dev/ttyACM1
[platformio]
default_envs = esp32-cluster

[env:esp32-cluster]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_cluster.csv
build_flags =
    -O2
    -std=gnu++11
    -I../../optimisation/esp32-baseline/src
    -DTM_A16_ROWS=64
build_src_filter =
    +<*>
    +<../../../optimisation/esp32-baseline/src/kernels.c>
    +<../../../optimisation/esp32-baseline/src/servo.cpp>
; symlinks to ../../optimisation/esp32-baseline/* (embed symbol names are
; derived from the path, so they have to sit at the project root)
board_build.embed_files =
    weights.bin
    weights_q12.bin

; Both nodes plus a hobby servo per board that sweeps while the pair is
; computing a forward together, as an activity indicator. Opt-in; the benchmark
; env above is unaffected. XIAO ESP32C3: A0 and D0 are the same pin, GPIO2.
;   pio run -e esp32-cluster-servo -t upload --upload-port <port>
[env:esp32-cluster-servo]
extends = env:esp32-cluster
build_flags =
    ${env:esp32-cluster.build_flags}
    -DTM_SERVO_PIN=2
