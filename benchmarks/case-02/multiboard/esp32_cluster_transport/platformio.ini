; PlatformIO CLI project for the Wi-Fi ESP32 cluster worker.
; Flash the same firmware to each board using the board's USB port.
;
;   pio run -e esp32-cluster -t upload --upload-port COM9
;   pio device monitor -p COM9 -b 115200
;
; The Wi-Fi credentials live in the ignored secrets.h file.
[platformio]
default_envs = esp32-cluster
src_dir = .

[env:esp32-cluster]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -std=gnu++11

[env:esp32-ring-serial]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 921600
upload_speed = 115200
build_flags =
    -O2
    -std=gnu++11
    -DRING_SERIAL_ONLY
