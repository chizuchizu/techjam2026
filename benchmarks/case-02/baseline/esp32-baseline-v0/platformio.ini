
; PlatformIO project for the Tech Jam case-2 transformer baseline on the
; Seeed XIAO ESP32C3. The whole point is the FAST hybrid numeric path
; (Q15xQ12 fixed-point GEMM) that fits the no-FPU C3 in ~2-4 s/forward.
;
; Two envs point at the same code:
;   esp32-baseline     - primary target, Seeed XIAO ESP32C3
;   esp32-c3-devkitc   - fallback board (generic ESP32-C3 devkit) for CI/host-less
;
; Weight blobs are embedded from the project root (weights.bin = 1.59 MB
; fp32 layout; weights_q12.bin = 0.79 MB Q12 + scales), total flash ~2.4 MB.
;
; Build & upload:
;   pio run -t upload                    (uses AUTO-DETECTED port)
;   pio run -e esp32-baseline -t upload  (explicit env)
;   pio device monitor -b 115200         (interact: M / R / T)
[platformio]
default_envs = esp32-baseline

[env:esp32-baseline]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
# single 3.9 MB app partition (no OTA) so the ~2.4 MB embedded weights fit
board_build.partitions = huge_app.csv
build_flags =
    -O2
    -std=gnu++11
    -DTM_MODE_DEFAULT=1
board_build.embed_files =
    weights.bin
    weights_q12.bin

[env:esp32-c3-devkitc]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -O2
    -std=gnu++11
    -DTM_MODE_DEFAULT=1
board_build.embed_files =
    weights.bin
    weights_q12.bin

; tinyprof instrumented build of the pre-optimisation firmware. Separate env so
; the plain esp32-baseline env still builds commit 79f284a's code with no
; instrumentation at all, which is what makes "42.15 s" reproducible here.
;
; TINYPROF_ATTN_PHASES=1 splits attention into QK / exp / PV. This firmware's
; attention is one fused j loop, so the split costs 132,096 zones per forward -
; about 0.1% against 42 s, and worth it to see the phase breakdown that
; optimisations/00_baseline_profile.md reports. Set it to 0 if the overhead
; tinyprof reports back is ever material.
;
;   pio run -e esp32-tinyprof-v0 -t upload
[env:esp32-tinyprof-v0]
extends = env:esp32-baseline
lib_extra_dirs = ../../../../tinyprof
lib_deps = tinyprof
build_flags =
    ${env:esp32-baseline.build_flags}
    -DTINYPROF_LIB=1
    -DTINYPROF_TAG=\"baseline-79f284a\"
    -DTINYPROF_ATTN_PHASES=1
