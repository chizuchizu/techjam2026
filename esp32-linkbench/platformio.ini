[platformio]
default_envs = link-server

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; --- optimized low-latency transport (unicast ESP-NOW, 802.11n HT40, MCS7-SGI, IRAM) ---
[env:link-server]
build_flags = -DBUILD_ROLE_SERVER

[env:link-client]
build_flags = -DBUILD_ROLE_CLIENT

; --- host-driven client: waits for 'B' on serial to run the bench ---
[env:link-client-ctl]
build_flags = -DBUILD_ROLE_CLIENT -DLF_AUTORUN=0

; --- COMPAT = the "before" transport (broadcast sends, no 11n/HT40/rate tuning) ---
[env:link-server-compat]
build_flags = -DBUILD_ROLE_SERVER -DLF_COMPAT=1

[env:link-client-compat]
build_flags = -DBUILD_ROLE_CLIENT -DLF_COMPAT=1

; --- STATION mode: same-WiFi IP communication -----------------------------
; Flash this ONE env onto ANY number of boards; identical image everywhere.
; Boards join the same STA WiFi, advertise via mDNS (esp32-XX.local), and
; auto-discover/ping each other over UDP broadcast (port 42100).
; EDIT the SSID/PASS below to your WiFi network, then:
;   pio run -e link-station -t upload -d /dev/cu.usbmodem101   (board 1)
;   pio run -e link-station -t upload -d /dev/cu.usbmodem1101  (board 2)
[env:link-station]
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=0
  -DLF_WIFI_PASS=\"linkfast123\"

; Dedicated radio sidecar for the original, untiled opt23 compute image.
; It transparently relays TCP port 5000 to UART1 at 2 Mbaud. Pair it with the
; esp32-uart-worker environment in the case-2 model project.
[env:pc-master-uart-bridge]
build_src_filter =
  +<pc_master_uart_bridge.cpp>
build_flags =
  -DLB_UART_BAUD=2000000
  -DLB_UART_RX_PIN=20
  -DLB_UART_TX_PIN=21




; --- STATION NAT ROUTER (LINKNET with internet) -------------------------------
; Same station firmware as link-station, plus -DLF_AP_NAT: this board hosts
; LINKNET (192.168.4.1) AND joins the configured uplink WiFi (the "WAN"), then
; NAPT-masquerades LINKNET clients so they reach the internet.
; REQUIRES Arduino core 3.x (lwIP NAPT compiled in) -> uses the pioarduino fork.
; EDIT -DLF_WIFI_SSID/PASS to an internet-enabled WiFi (e.g. a phone hotspot).
;   pio run -e link-station-nat -t upload -d /dev/cu.usbmodem101   (the router)
[env:link-station-nat]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_AP_NAT=1
  -DLF_AP_SSID=\"LINKNET\"
  -DLF_AP_PASS=\"linkfast123\"
  -DLF_WIFI_SSID=\"NTUGUEST\"
  -DLF_WIFI_PASS=\"\"
