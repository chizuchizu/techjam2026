[platformio]
default_envs = link-server

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; --- optimized low-latency transport (unicast ESP-NOW, 802.11n HT40, MCS7-SGI, IRAM) ---
[env:link-server]
build_flags = -DBUILD_ROLE_SERVER

[env:link-client]
build_flags = -DBUILD_ROLE_CLIENT

; --- host-driven client: waits for 'B' on serial to run the bench ---
[env:link-client-ctl]
build_flags = -DBUILD_ROLE_CLIENT -DLF_AUTORUN=0

; --- COMPAT = the "before" transport (broadcast sends, no 11n/HT40/rate tuning) ---
[env:link-server-compat]
build_flags = -DBUILD_ROLE_SERVER -DLF_COMPAT=1

[env:link-client-compat]
build_flags = -DBUILD_ROLE_CLIENT -DLF_COMPAT=1

; --- STATION mode: same-WiFi IP communication -----------------------------
; Flash this ONE env onto ANY number of boards; identical image everywhere.
; Boards join the same STA WiFi, advertise via mDNS (esp32-XX.local), and
; auto-discover/ping each other over UDP broadcast (port 42100).
; EDIT the SSID/PASS below to your WiFi network, then:
;   pio run -e link-station -t upload -d /dev/cu.usbmodem101   (board 1)
;   pio run -e link-station -t upload -d /dev/cu.usbmodem1101  (board 2)
[env:link-station]
; only the station fleet image here; the UART sidecar is a link-only image
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=0
  -DLF_WIFI_PASS=\"linkfast123\"

; Dedicated radio sidecar for the original, untiled opt23 compute image.
; It transparently relays TCP port 5000 to UART1 at 2 Mbaud. Pair it with the
; esp32-uart-worker environment in the case-2 model project.
; --- link-station-espnow, FORCED-AP role (board 101 = the AP host) ------------
; Same espnow bench image, but this board ALWAYS hosts the LINKNET AP so the
; test topology is deterministic (other board joins as STA). Upload to board 1.
[env:link-station-espnow-ap]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_FORCE_AP=1
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_BENCH_ROUNDS=64
  -DLF_ESPNOW_BENCH_INTERVAL_MS=15

; --- link-station + Phase-2 ESP-NOW fast-path RTT bench ----------------------
; Same station fleet image, with LF_ESPNOW_BENCH=1: the coordinator broadcast-
; dispatches tiny control frames over ESP-NOW and measures broadcast->slotted-
; reply RTT in us (vs UDP PING/PONG ms baseline). Auto JOB demo is off here so
; UDP traffic cannot perturb the ESP-NOW timing.
;   pio run -e link-station-espnow -t upload -d /dev/cu.usbmodem101
;   pio run -e link-station-espnow -t upload -d /dev/cu.usbmodem1101
[env:link-station-espnow]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=0
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_BENCH_ROUNDS=64
  -DLF_ESPNOW_BENCH_INTERVAL_MS=15


[env:link-station-espnow-256]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=0
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_BENCH_ROUNDS=256
  -DLF_ESPNOW_BENCH_INTERVAL_MS=15

[env:link-station-espnow-256ap]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=1
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_BENCH_ROUNDS=256
  -DLF_ESPNOW_BENCH_INTERVAL_MS=15

; --- diagnostics: longer reply window to catch late-reply timing --------------
; Same espnow bench, but the coordinator waits 1200ms for a reply (still sends a
; new round every 15ms only after a match) and only 16 measured rounds. Use to
; distinguish "reply never sent/never arrives" from "reply arrives >200ms late".
[env:link-station-espnow-dtc]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=0
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_BENCH_ROUNDS=16
  -DLF_ESPNOW_BENCH_INTERVAL_MS=15
  -DLF_ESPNOW_TIMEOUT_MS=1200

; --- diagnostics: bidirectional ESP-NOW ping -----------------------------------
; Both boards broadcast once every 300ms for 20 rounds and log every received
; frame with board-local t_ms. Use to measure true one-way delay per direction
; and to isolate AP->STA vs STA->AP delivery.
[env:link-station-espnow-ping]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=0
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_DIAG_PING=1
  -DLF_ESPNOW_BENCH_ROUNDS=0

; --- ping variant hosted on the AP board ----------------------------------------
[env:link-station-espnow-pingap]
build_src_filter = +<station_comm.cpp>
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_WIFI_SSID=\"LINKNET\"
  -DLF_FORCE_AP=1
  -DLF_WIFI_PASS=\"linkfast123\"
  -DLF_DEMO_AUTO=0
  -DLF_ESPNOW_BENCH=1
  -DLF_ESPNOW_DIAG_PING=1
  -DLF_ESPNOW_BENCH_ROUNDS=0

; --- minimal ESP-NOW sanity app (isolate platform vs fleet code) -------------
[env:espnow-min-ap]
build_src_filter = +<espnow_min.cpp>
build_flags =
  -DESPNOW_MIN_AP=1

[env:espnow-min-sta]
build_src_filter = +<espnow_min.cpp>
build_flags =
  -DESPNOW_MIN_STA=1

[env:pc-master-uart-bridge]
build_src_filter =
  +<pc_master_uart_bridge.cpp>
build_flags =
  -DLB_UART_BAUD=2000000
  -DLB_UART_RX_PIN=20
  -DLB_UART_TX_PIN=21




; --- STATION NAT ROUTER (LINKNET with internet) -------------------------------
; Same station firmware as link-station, plus -DLF_AP_NAT: this board hosts
; LINKNET (192.168.4.1) AND joins the configured uplink WiFi (the "WAN"), then
; NAPT-masquerades LINKNET clients so they reach the internet.
; REQUIRES Arduino core 3.x (lwIP NAPT compiled in) -> uses the pioarduino fork.
; EDIT -DLF_WIFI_SSID/PASS to an internet-enabled WiFi (e.g. a phone hotspot).
;   pio run -e link-station-nat -t upload -d /dev/cu.usbmodem101   (the router)
[env:link-station-nat]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
build_flags =
  -DBUILD_ROLE_STATION
  -DLF_AP_NAT=1
  -DLF_AP_SSID=\"LINKNET\"
  -DLF_AP_PASS=\"linkfast123\"
  -DLF_WIFI_SSID=\"NTUGUEST\"
  -DLF_WIFI_PASS=\"\"
